spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Security & JWT
sierrarowerra.app.jwtSecret=SecretKeyForTest12345678901234567890123456789012345678901234567890
sierrarowerra.app.jwtExpirationMs=3600000
sierrarowerra.app.cors.allowed-origins=http://localhost:3000

# App URLs
app.frontend.base-url=http://localhost:3000
app.oauth2.authorizedRedirectUri=http://localhost:3000/oauth2/redirect

# Stripe
stripe.api.secret-key=sk_test_mock
stripe.api.public-key=pk_test_mock
stripe.webhook.secret=whsec_test_mock

# OAuth2 Client
spring.security.oauth2.client.registration.google.client-id=test-id
spring.security.oauth2.client.registration.google.client-secret=test-secret

# Mail
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# File Storage
file.upload-dir=build/test-uploads
